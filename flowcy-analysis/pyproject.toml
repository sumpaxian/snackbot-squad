[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowcy"
version = "0.1.0"
description = "FlowCy Analysis – Desktop-Anwendung zur Auswertung durchflusszytometrischer Daten"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "flowio>=1.3",
  "flowutils>=1.1",
  "flowkit>=1.2",
  "contourpy>=1.2",
  "matplotlib>=3.7",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
flowcy = "flowcy.cli:main"

[tool.setuptools.packages.find]
include = ["flowcy*"]

[tool.setuptools.package-data]
flowcy = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
